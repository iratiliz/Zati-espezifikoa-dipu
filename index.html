<body>

<style>
/* Layout: una columna de estudio (máx. 680px), tres pantallas: inicio · test · resultado */
:root{
  --bg:#f4f3f8; --surface:#ffffff; --ink:#1c1a2b; --muted:#635f78; --line:#dddae8;
  --accent:#4b3a8f; --accent-soft:#ebe7f7; --ok:#1d7a4a; --ok-soft:#e1f2e8; --bad:#b3362c; --bad-soft:#f8e4e1; --warn:#a46a10;
  --f-read:Georgia,"Iowan Old Style","Times New Roman",serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13121a; --surface:#1c1b26; --ink:#e9e7f2; --muted:#a19cb8; --line:#302d40;
  --accent:#b3a5ef; --accent-soft:#2b2645; --ok:#6fd09a; --ok-soft:#173326; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e3b05a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121a; --surface:#1c1b26; --ink:#e9e7f2; --muted:#a19cb8; --line:#302d40;
  --accent:#b3a5ef; --accent-soft:#2b2645; --ok:#6fd09a; --ok-soft:#173326; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e3b05a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2{text-wrap:balance;margin:0}
h1{font-family:var(--f-read);font-weight:600;font-size:1.65rem;line-height:1.2}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{display:flex;flex-direction:column;gap:2px}
.summary b{font-family:var(--f-num);font-size:1.35rem;font-weight:500}
.summary span{font-size:.78rem;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:.85rem;font-weight:600}
.bloque{border-top:1px solid var(--line);padding-top:10px}
.bloque:first-child{border-top:0;padding-top:0}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bhead b{font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.tema{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.tema input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.tema .t{min-width:0;display:flex;flex-direction:column;gap:5px}
.tema .t span{font-size:.9rem}
.tema .t small{color:var(--muted);font-size:.75rem}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.pct{font-family:var(--f-num);font-size:.8rem;color:var(--muted);min-width:3.2em;text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:.85rem;font-weight:600}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:13px 18px;font-weight:600;font-size:1rem;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 16px;font-weight:500}
.ghost:disabled{opacity:.45}
.note{font-size:.8rem;color:var(--muted)}
.resume{border-color:var(--accent);background:var(--accent-soft)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.top .row{justify-content:space-between}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qmeta{font-size:.8rem;color:var(--muted)}
.qtext{font-family:var(--f-read);font-size:1.13rem;line-height:1.55;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px}
.opt .l{font-family:var(--f-num);width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt .x{min-width:0;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}.opt.sel .l{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.expl{background:var(--accent-soft);border-radius:8px;padding:12px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.expl p{margin:0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav .primary{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.grid button{font-family:var(--f-num);font-size:.78rem;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--accent)}
.timer{font-family:var(--f-num);font-size:.85rem}
.timer.low{color:var(--warn)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-read);font-size:3rem;font-weight:600;line-height:1}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ritem p{margin:0}
.ritem .q{font-family:var(--f-read)}
.ritem .a{font-size:.88rem}
.ritem .a.bad{color:var(--bad)}.ritem .a.ok{color:var(--ok)}
.ritem .e{font-size:.85rem;color:var(--muted)}
.confirm{border-color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const Q = [[2175943820,19,"¿Cuántos artículos tiene la Constitución Española de 1978?",["170","168","165","169"],3,"La CE consta de 169 artículos, 4 disposiciones adicionales, 9 transitorias, 1 derogatoria y 1 final."],[376253188,19,"Según el art. 1.1 CE, son valores superiores del ordenamiento jurídico:",["La dignidad, la justicia, la igualdad y la solidaridad.","La libertad, la justicia, la igualdad y el pluralismo político.","La libertad, la seguridad jurídica, la igualdad y el pluralismo político.","La libertad, la justicia, la solidaridad y el pluralismo político."],1,"Art. 1.1 CE: libertad, justicia, igualdad y pluralismo político. Ni la solidaridad ni la seguridad jurídica están en esta lista."],[1931209569,19,"¿Cuál de los siguientes NO figura entre los principios que garantiza el art. 9.3 CE?",["La publicidad de las normas.","La solidaridad entre los territorios.","La responsabilidad de los poderes públicos.","La interdicción de la arbitrariedad de los poderes públicos."],1,"Art. 9.3 CE: legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad. La solidaridad aparece en los arts. 2 y 138."],[4064230938,19,"Según el art. 9.3 CE, la irretroactividad se garantiza respecto de:",["Las disposiciones sancionadoras no favorables o restrictivas de derechos individuales.","Todas las normas con rango de ley.","Todas las disposiciones sancionadoras, sean o no favorables.","Las disposiciones tributarias y sancionadoras en todo caso."],0,"La irretroactividad no es absoluta: solo alcanza a las disposiciones sancionadoras no favorables o restrictivas de derechos individuales (art. 9.3 CE)."],[2375095710,19,"El mandato a los poderes públicos de promover las condiciones para que la libertad y la igualdad sean reales y efectivas se recoge en el:",["Art. 1.1 CE.","Art. 9.1 CE.","Art. 14 CE.","Art. 9.2 CE."],3,"El art. 9.2 CE recoge la igualdad material; el art. 14 la igualdad formal ante la ley."],[4103061142,19,"Según el art. 3 CE, las demás lenguas españolas distintas del castellano:",["Son oficiales en todo el territorio del Estado.","Serán también oficiales en las respectivas Comunidades Autónomas de acuerdo con sus Estatutos.","Sustituyen al castellano como lengua oficial en su Comunidad Autónoma.","Solo son objeto de especial respeto y protección, sin carácter oficial."],1,"Art. 3.2 CE: oficialidad compartida en las CCAA según sus Estatutos, sin excluir el castellano."],[2151603761,19,"Según el art. 13 CE, ¿qué derechos del Título I están reservados a los españoles, salvo excepción?",["Los del art. 23 (participación política), salvo el sufragio activo y pasivo en elecciones municipales por reciprocidad.","Los de reunión y asociación.","El derecho a la tutela judicial efectiva.","Todos los de la Sección 1.ª del Capítulo II."],0,"Art. 13.2 CE: solo los españoles son titulares del art. 23, salvo el sufragio municipal atendiendo a criterios de reciprocidad."],[640585837,19,"La detención preventiva no podrá durar más del tiempo estrictamente necesario y, en todo caso, el detenido deberá ser puesto en libertad o a disposición judicial en un plazo máximo de:",["72 horas.","24 horas.","48 horas.","96 horas."],0,"Art. 17.2 CE: máximo de 72 horas."],[1694715256,19,"Respecto del derecho de reunión pacífica y sin armas (art. 21 CE):",["Solo puede prohibirse por resolución judicial.","Requiere autorización previa solo en lugares de tránsito público.","No necesita autorización previa; en lugares de tránsito público y manifestaciones se dará comunicación previa a la autoridad.","Requiere autorización previa de la autoridad gubernativa en todo caso."],2,"Art. 21 CE: sin autorización previa; comunicación previa en lugares de tránsito público, que la autoridad solo puede prohibir por razones fundadas de alteración del orden público con peligro para personas o bienes."],[1884069848,19,"Según el art. 22 CE, las asociaciones:",["Solo podrán ser disueltas o suspendidas en sus actividades en virtud de resolución judicial motivada.","Deben inscribirse en un registro para adquirir existencia legal.","Pueden ser disueltas por resolución gubernativa motivada.","Pueden tener carácter secreto si sus fines son lícitos."],0,"Art. 22 CE: la inscripción registral es a los solos efectos de publicidad; disolución o suspensión solo por resolución judicial motivada; prohibidas las secretas y paramilitares."],[1066755992,19,"El art. 25.3 CE establece que la Administración civil:",["No podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad.","Podrá imponer sanciones privativas de libertad de hasta 72 horas.","Podrá imponer arresto subsidiario por impago de multas.","Solo podrá sancionar previa autorización judicial."],0,"Art. 25.3 CE."],[580868737,19,"¿Cuál de los siguientes derechos se encuentra en la Sección 2.ª del Capítulo II del Título I (arts. 30-38) y no en la Sección 1.ª?",["El derecho de petición.","El derecho de huelga.","La libertad sindical.","El derecho a la negociación colectiva laboral."],3,"La negociación colectiva es el art. 37 (Sección 2.ª). La huelga y la libertad sindical (art. 28) y el derecho de petición (art. 29) están en la Sección 1.ª."],[1518149113,19,"¿Cuál de los siguientes derechos de la Sección 2.ª del Capítulo II es protegible mediante recurso de amparo, por remisión expresa del art. 53.2 CE?",["El derecho al trabajo del art. 35.","La libertad de empresa del art. 38.","La objeción de conciencia del art. 30.","El derecho de propiedad del art. 33."],2,"El art. 53.2 CE extiende el amparo a la objeción de conciencia reconocida en el art. 30."],[3892998753,19,"Los principios rectores de la política social y económica (Capítulo III del Título I):",["Son tutelables mediante recurso de amparo.","Gozan de procedimiento preferente y sumario ante los tribunales ordinarios.","Solo pueden regularse por ley orgánica.","Solo podrán ser alegados ante la jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen."],3,"Art. 53.3 CE."],[3989005454,19,"En el estado de excepción, ¿qué garantía del art. 17 NO puede suspenderse según el art. 55.1 CE?",["El derecho a la libertad del art. 17.1.","Ninguna: en el estado de excepción puede suspenderse todo el art. 17.","El apartado 3 del art. 17 (información de derechos y asistencia de abogado al detenido).","El plazo máximo de detención del art. 17.2."],2,"Art. 55.1 CE: se exceptúa de la suspensión el art. 17.3 para el supuesto de declaración de estado de excepción."],[2083818376,19,"El derecho de gracia que corresponde al Rey (art. 62.i CE):",["Se ejerce con arreglo a la ley, que no podrá autorizar indultos generales.","Comprende los indultos generales previa autorización de las Cortes.","No requiere refrendo.","Es una competencia que corresponde exclusivamente al Consejo General del Poder Judicial."],0,"Art. 62.i CE."],[1513033253,19,"¿Qué acto del Rey NO está sujeto a refrendo según la Constitución?",["La disolución de las Cortes Generales.","La propuesta de candidato a Presidente del Gobierno.","La sanción de las leyes.","El nombramiento y relevo de los miembros civiles y militares de su Casa."],3,"Art. 65.2 CE en relación con el art. 64."],[310496800,19,"La propuesta y el nombramiento del Presidente del Gobierno, y la disolución prevista en el art. 99 CE, son refrendados por:",["El Presidente del Congreso.","El Presidente del Senado.","El Ministro de Justicia.","El Presidente del Gobierno en funciones."],0,"Art. 64.1 CE."],[1377865749,19,"En el orden de sucesión a la Corona (art. 57 CE), el criterio que se aplica en primer lugar es:",["La preferencia de la línea anterior sobre las posteriores.","La designación por las Cortes Generales.","La preferencia del varón sobre la mujer.","La preferencia de la persona de más edad."],0,"Orden: línea, grado, sexo y edad."],[3040799900,19,"El Presidente del Gobierno debe presentar los Presupuestos Generales del Estado ante el Congreso al menos:",["Antes del 1 de septiembre.","Tres meses antes de la expiración de los del año anterior.","Seis meses antes de la expiración de los del año anterior.","Dos meses antes de la expiración de los del año anterior."],1,"Art. 134.3 CE. Si no se aprueban antes del primer día del ejercicio, se prorrogan automáticamente los del anterior (art. 134.4)."],[3484189086,19,"Según el art. 134.7 CE, la Ley de Presupuestos:",["No puede crear tributos; podrá modificarlos cuando una ley tributaria sustantiva así lo prevea.","Puede crear tributos de carácter temporal.","Puede crear y modificar tributos sin limitación alguna.","No puede modificar tributos en ningún caso."],0,"Art. 134.7 CE."],[264657076,19,"La potestad originaria para establecer los tributos corresponde:",["Al Estado, a las CCAA y a las Corporaciones locales.","Al Estado y a las Comunidades Autónomas por igual.","Exclusivamente al Estado, mediante ley.","Al Gobierno mediante real decreto."],2,"Art. 133.1 CE. Las CCAA y Corporaciones locales tienen potestad derivada (art. 133.2)."],[969097884,19,"El Tribunal de Cuentas:",["Es el supremo órgano consultivo del Gobierno.","Es un órgano del Poder Judicial dependiente del CGPJ.","Es el supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado y del sector público, y depende directamente de las Cortes Generales.","Depende del Ministerio de Hacienda."],2,"Art. 136 CE. El supremo órgano consultivo del Gobierno es el Consejo de Estado (art. 107)."],[3625792593,20,"Según la Ley 50/1997, del Gobierno, este se compone de:",["El Presidente y los Ministros, únicamente.","El Presidente, el Vicepresidente o Vicepresidentes, en su caso, y los Ministros.","El Presidente, los Vicepresidentes, los Ministros y los Secretarios de Estado.","El Presidente, los Ministros, los Secretarios de Estado y los Subsecretarios."],1,"Art. 1.2 Ley 50/1997 y art. 98.1 CE. Los Secretarios de Estado son órganos de colaboración, no miembros del Gobierno."],[1249378054,20,"Los miembros del Gobierno se reúnen en:",["Consejo de Ministros y Comisiones Delegadas del Gobierno.","Consejo de Ministros únicamente.","Consejo de Ministros y Comisión General de Secretarios de Estado y Subsecretarios.","Consejo de Ministros, Comisiones Delegadas y Secretariado del Gobierno."],0,"Art. 1.3 Ley 50/1997."],[2705648314,20,"¿Cuál de las siguientes funciones del Presidente del Gobierno requiere la previa deliberación del Consejo de Ministros, según el art. 2 de la Ley 50/1997?",["Plantear ante el Congreso la cuestión de confianza.","Resolver los conflictos de atribuciones entre Ministerios.","Proponer al Rey el nombramiento y separación de los Ministros.","Interponer el recurso de inconstitucionalidad."],0,"Requieren deliberación previa del Consejo de Ministros la propuesta de disolución de las Cámaras (art. 2.2.c) y la cuestión de confianza (art. 2.2.d)."],[176658472,20,"Crear, modificar y suprimir, por Real Decreto, los Departamentos Ministeriales y las Secretarías de Estado corresponde:",["A las Cortes Generales mediante ley.","Al Ministro de Hacienda y Función Pública.","Al Consejo de Ministros.","Al Presidente del Gobierno."],3,"Art. 2.2.j) Ley 50/1997. Crear, modificar y suprimir los órganos directivos de los Departamentos corresponde al Consejo de Ministros (art. 5.1.i)."],[3350399331,20,"Resolver los conflictos de atribuciones que puedan surgir entre los diferentes Ministerios corresponde a:",["El Presidente del Gobierno.","El Ministro de la Presidencia.","La Comisión General de Secretarios de Estado y Subsecretarios.","El Consejo de Ministros."],0,"Art. 2.2.l) Ley 50/1997."],[1938515842,20,"Las deliberaciones del Consejo de Ministros y de las Comisiones Delegadas del Gobierno tienen carácter:",["Secreto.","Público, salvo acuerdo en contrario.","Confidencial.","Reservado."],0,"Arts. 5.3 y 6.5 Ley 50/1997. Las de la Comisión General de Secretarios de Estado y Subsecretarios son reservadas."],[2989149873,20,"Respecto de la Comisión General de Secretarios de Estado y Subsecretarios, es correcto que:",["La preside el Presidente del Gobierno.","Puede adoptar acuerdos por delegación del Consejo de Ministros.","Sus deliberaciones son secretas.","En ningún caso podrá adoptar decisiones o acuerdos por delegación del Gobierno."],3,"Art. 8 Ley 50/1997: la preside un Vicepresidente o, en su defecto, el Ministro de la Presidencia; sus deliberaciones son reservadas."],[424198524,20,"Las Comisiones Delegadas del Gobierno se crean, modifican y suprimen:",["Por Real Decreto del Presidente del Gobierno.","Por Orden del Ministro de la Presidencia.","Por ley.","Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno."],3,"Art. 6.1 Ley 50/1997."],[1878279719,20,"Aprobar los reglamentos para el desarrollo y la ejecución de las leyes, previo dictamen del Consejo de Estado, corresponde a:",["Cada Ministro en su ámbito.","Las Comisiones Delegadas del Gobierno.","El Consejo de Ministros.","El Presidente del Gobierno."],2,"Art. 5.1.h) Ley 50/1997."],[266559043,20,"¿Cuál de los siguientes NO es requisito para ser miembro del Gobierno según el art. 11 de la Ley 50/1997?",["Ser Diputado o Senador.","Ser español.","No estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme.","Ser mayor de edad."],0,"No se exige la condición de parlamentario. Sí: ser español, mayor de edad, disfrutar de sufragio activo y pasivo, no estar inhabilitado y la idoneidad de la Ley 3/2015."],[2373705037,20,"Según el art. 12 de la Ley 50/1997, en el nombramiento de las personas titulares de las Vicepresidencias y Ministerios, cada sexo debe suponer como mínimo:",["El 30 por ciento del conjunto.","El 40 por ciento del conjunto.","El 45 por ciento del conjunto.","El 50 por ciento del conjunto."],1,"Principio de presencia equilibrada (art. 12.2 bis Ley 50/1997)."],[1831847719,20,"En caso de vacante, ausencia o enfermedad del Presidente del Gobierno, sus funciones serán asumidas por:",["El Ministro de mayor edad.","El Presidente del Congreso de los Diputados.","El Ministro de la Presidencia.","Los Vicepresidentes, de acuerdo con el correspondiente orden de prelación y, en defecto de ellos, los Ministros según el orden de precedencia de los Departamentos."],3,"Art. 13.1 Ley 50/1997."],[128671419,20,"Los Secretarios de Estado son nombrados y separados:",["Por Orden del Ministro correspondiente.","Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan.","Por el Rey, a propuesta del Presidente del Gobierno.","Por Real Decreto del Presidente del Gobierno."],1,"Art. 15.1 Ley 50/1997."],[2751262931,20,"Los Directores de Gabinete de los Secretarios de Estado son nombrados:",["Por resolución del propio Secretario de Estado.","Por Orden ministerial, con conocimiento previo del Consejo de Ministros.","Por Real Decreto aprobado en Consejo de Ministros.","Por Real Decreto del Presidente del Gobierno."],1,"Art. 16.1 Ley 50/1997. Los de Presidente, Vicepresidentes y Ministros, por Real Decreto aprobado en Consejo de Ministros."],[2829298871,20,"En el acta de las sesiones del Consejo de Ministros figurarán exclusivamente:",["Únicamente los acuerdos adoptados.","El resumen de las deliberaciones y los acuerdos adoptados.","Las circunstancias relativas al tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados.","Los votos particulares de los Ministros discrepantes."],2,"Art. 18.3 Ley 50/1997."],[3606754421,20,"¿Cuál de las siguientes competencias es delegable según el art. 20 de la Ley 50/1997?",["Las relativas al nombramiento y separación de los altos cargos atribuidas al Consejo de Ministros.","Las funciones administrativas del Consejo de Ministros en las Comisiones Delegadas del Gobierno.","Las atribuidas directamente por la Constitución.","Las atribuidas por una ley que prohíba o de 400 Diputados.","Exactamente 350 Diputados."],2,"La CE fija la horquilla 300-400; la ley electoral (LOREG) fija 350."],[3869934813,21,"En cada provincia se eligen, por sufragio universal, libre, igual, directo y secreto:",["Tres Senadores.","Cuatro Senadores.","Dos Senadores.","Un Senador por cada millón de habitantes."],1,"Art. 69.2 CE. Las CCAA designan además un Senador y otro más por cada millón de habitantes (art. 69.5)."],[3362205152,21,"Los periodos ordinarios de sesiones de las Cámaras son:",["De septiembre a junio, de forma continuada.","De octubre a diciembre y de febrero a junio.","De septiembre a diciembre y de febrero a junio.","De septiembre a diciembre y de enero a junio."],2,"Art. 73.1 CE."],[2903684034,21,"¿Cuál de las siguientes materias NO puede delegarse en las Comisiones Legislativas Permanentes (art. 75.3 CE)?",["Una ley ordinaria de modificación del Código Civil.","Una ley de transportes terrestres.","Los Presupuestos Generales del Estado.","Una ley ordinaria de régimen local."],2,"Indelegables: reforma constitucional, cuestiones internacionales, leyes orgánicas y de bases y Presupuestos Generales del Estado."],[2954351141,21,"La Diputación Permanente de cada Cámara estará compuesta por:",["Un mínimo de 21 miembros.","Un máximo de 21 miembros.","20 miembros y su Presidente.","Un mínimo de 15 miembros."],0,"Art. 78.1 CE: mínimo de 21 miembros, presidida por el Presidente de la Cámara."],[453115539,21,"Según el art. 81 CE, la aprobación, modificación o derogación de las leyes orgánicas exige:",["Mayoría absoluta de ambas Cámaras.","Mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto.","Mayoría simple del Congreso y mayoría absoluta del Senado.","Mayoría de tres quintos del Congreso."],1,"Art. 81.2 CE."],[3804439220,21,"La delegación legislativa para la formación de textos articulados se otorga mediante:",["Una ley de bases.","Una ley orgánica.","Un decreto-ley.","Una ley ordinaria."],0,"Art. 82.2 CE: ley de bases para textos articulados; ley ordinaria para refundir textos legales."],[2440125540,21,"¿Cuál de las siguientes materias puede regularse por decreto-ley?",["El Derecho electoral general.","Ninguna de las otras: todas ellas están excluidas del decreto-ley.","Los derechos, deberes y libertades de los ciudadanos del Título I.","El régimen de las Comunidades Autónomas."],1,"Art. 86.1 CE: los decretos-leyes no pueden afectar a las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las CCAA ni al Derecho electoral general."],[4217993968,21,"Los decretos-leyes deberán ser sometidos a debate y votación de totalidad al Congreso en el plazo de:",["Los 2 meses siguientes a su publicación.","Los 30 días hábiles siguientes a su publicación.","Los 30 días siguientes a su promulgación.","Los 15 días siguientes a su promulgación."],2,"Art. 86.2 CE."],[4040552197,21,"Para la iniciativa legislativa popular se exigen no menos de:",["500.000 firmas acreditadas.","1.000.000 de firmas acreditadas.","750.000 firmas acreditadas.","250.000 firmas acreditadas."],0,"Art. 87.3 CE. No procede en materias propias de ley orgánica, tributarias, de carácter internacional ni en la prerrogativa de gracia."],[3061667145,21,"El Senado dispone, para oponer su veto o introducir enmiendas a un proyecto de ley no declarado urgente, de un plazo de:",["Un mes.","Dos meses.","Veinte días naturales.","Tres meses."],1,"Art. 90.2 CE. Si el proyecto es urgente, 20 días naturales (art. 90.3)."],[4109457748,21,"Levantado el veto del Senado una vez transcurridos dos meses desde su interposición, el Congreso puede ratificar el texto inicial por:",["Mayoría simple.","Mayoría absoluta.","Mayoría de dos tercios.","Mayoría de tres quintos."],0,"Art. 90.2 CE: antes de 2 meses hace falta mayoría absoluta; pasados 2 meses, mayoría simple."],[1573239806,21,"El Rey sancionará las leyes aprobadas por las Cortes Generales en el plazo de:",["30 días.","10 días.","15 días.","8 dí ís Vasco tiene competencia de:",["Desarrollo legislativo y ejecución dentro de su territorio de la legislación básica del Estado.","Exclusiva.","Ninguna: es competencia exclusiva del Estado.","Ejecución de la legislación del Estado."],0,"Art. 11.1.b) EAPV."],[2771282761,29,"¿Cuál de las siguientes materias es de mera ejecución de la legislación del Estado según el art. 12 del Estatuto?",["El régimen local.","Las cooperativas.","La agricultura y ganadería.","La legislación laboral."],3,"Art. 12.2 EAPV. Las otras tres son competencias exclusivas del art. 10."],[2738493022,29,"Según el art. 13 del Estatuto, en el ámbito de la Administración de Justicia corresponde íntegramente al Estado:",["El derecho de gracia y la organización y funcionamiento del Ministerio Fiscal.","La provisión de medios materiales.","La fijación de la delimitación de las demarcaciones territoriales de los órganos jurisdiccionales.","La provisión del personal al servicio de la Administración de Justicia."],0,"Art. 13.2 EAPV."],[621386543,29,"El art. 15 del Estatuto prevé la creación por ley de un órgano similar al Defensor del Pueblo, que es:",["La Comisión Jurídica Asesora de Euskadi.","El Ararteko.","El Tribunal Vasco de Cuentas Públicas.","La Comisión Arbitral."],1,"Regulado por la Ley 3/1985, de 27 de febrero."],[232388539,29,"Según el art. 17 del Estatuto, el mando supremo de la Policía Autónoma corresponde a:",["El Delegado del Gobierno en el País Vasco.","El Gobierno del País Vasco, sin perjuicio de las competencias que puedan ostentar las Diputaciones Forales y Corporaciones Locales.","Las Diputaciones Forales en su respectivo territorio.","El Lehendakari, previa autorización de la Junta de Seguridad."],1,"Art. 17.4 EAPV."],[412939553,29,"Según el art. 21 del Estatuto, en las materias de competencia exclusiva de la Comunidad Autónoma:",["El Derecho estatal solo se aplica si así lo establece una ley vasca.","El Derecho de los Territorios Históricos prevalece sobre el Derecho de la Comunidad.","El Derecho estatal prevalece sobre el autonómico.","El Derecho emanado del País Vasco se aplica con preferencia a cualquier otro y solo en su defecto es de aplicación supletoria el Derecho del Estado."],3,"Art. 21 EAPV."],[2798577321,29,"Los convenios que celebre la Comunidad Autónoma del País Vasco con otras Comunidades para la gestión y prestación de servicios propios de su exclusiva competencia:",["Requieren ley orgánica.","No requieren comunicación alguna.","Deben comunicarse a las Cortes Generales, que pueden manifestar reparos en el plazo de 30 días.","Requieren autorización previa de las Cortes Generales."],2,"Art. 22.1 EAPV. Los acuerdos de cooperación sí requieren autorización previa de las Cortes (art. 22.3)."],[4145377006,29,"Según el art. 24 del Estatuto, los poderes del País Vasco se ejercerán a través de:",["El Parlamento, el Gobierno y las Juntas Generales.","El Parlamento, el Gobierno y su Presidente o Lehendakari.","El Parlamento, el Gobierno y el Tribunal Superior de Justicia.","El Lehendakari, el Parlamento y las Diputaciones Forales."],1,"Art. 24.1 EAPV. Los Territorios Históricos conservan y organizan sus instituciones forales (art. 24.2)."],[3032127270,29,"El Parlamento Vasco estará integrado, según el art. 26 del Estatuto, por:",["Un número igual de representantes de cada Territorio Histórico, elegidos por sufragio universal con criterio de representación proporcional.","Veinte representantes por Territorio Histórico en todo caso.","Un número de representantes proporcional a la población de cada Territorio Histórico.","Representantes elegidos en una circunscripción única para toda la Comunidad."],0,"Art. 26.1 EAPV. La circunscripción es el Territorio Histórico; en la práctica, 25 por Territorio (75)."],[1108299809,29,"Los parlamentarios vascos, durante su mandato y por los actos delictivos cometidos en el territorio de la Comunidad Autónoma:",["Serán juzgados por la Sala de lo Penal del Tribunal Supremo.","Serán juzgados por la Audiencia Provincial correspondiente.","No podrán ser inculpados sin autorización del Parlamento Vasco.","Solo podrán ser detenidos en caso de flagrante delito, correspondiendo decidir sobre su inculpación, prisión, procesamiento y juicio al Tribunal Superior de Justicia del País Vasco."],3,"Art. 26.6 EAPV. Fuera del territorio vasco, la responsabilidad penal es exigible ante la Sala de lo Penal del Tribunal Supremo."],[2841428449,29,"Según el art. 27.2 del Estatuto, los periodos ordinarios de sesiones del Parlamento Vasco comprenderán, como mínimo:",["Diez meses al año.","Nueve meses al año.","Seis meses al año.","Ocho meses al año."],3,"El Reglamento del Parlamento fija dos periodos: septiembre-diciembre y febrero-junio."],[1273973225,29,"El Parlamento Vasco se reunirá en sesión extraordinaria a petición de:",["El Gobierno o la mayoría absoluta de sus miembros.","La Junta de Portavoces.","El Gobierno, la Diputación Permanente o un tercio de sus miembros.","El Lehendakari o la quinta parte de sus miembros."],2,"Art. 27.3 EAPV."],[325962233,29,"Tienen iniciativa legislativa ante el Parlamento Vasco, según el art. 27.4 del Estatuto:",["Los miembros del Parlamento, el Gobierno y las instituciones representativas de los Territorios Históricos.","Los grupos parlamentarios y los Ayuntamientos de más de 50.000 habitantes.","El Gobierno y las Diputaciones Forales.","Los miembros del Parlamento y el Gobierno, exclusivamente."],0,"Art. 27.4 EAPV; también la iniciativa popular conforme a ley."],[3991568942,29,"Las leyes del Parlamento Vasco serán promulgadas por el Presidente del Gobierno Vasco, que ordenará su publicación en el BOPV en el plazo de:",["Veinte días desde su aprobación.","Un mes desde su aprobación.","Quince días desde su aprobación, y en el BOE.","Diez días desde su aprobación."],2,"Art. 27.5 EAPV. A efectos de vigencia rige la fecha de publicación en el BOPV."],[2703140473,29,"El Lehendakari es designado por el Parlamento Vasco de entre sus miembros y nombrado por:",["E  la Cámara.","Los votos de los grupos que apoyaron la investidura.","Las tres quintas partes de la Cámara.","La mayoría absoluta de la Cámara."],0,"Art. 46 Ley 7/1981."],[1728461912,29,"La suspensión del Lehendakari por imposibilidad transitoria debe ser apreciada por el Gobierno mediante acuerdo de:",["Unanimidad de sus miembros.","La mayoría absoluta de sus miembros.","Las dos terceras partes de sus miembros.","Las cuatro quintas partes de sus miembros."],3,"Art. 9 Ley 7/1981. La interinidad dura como máximo cuatro meses."],[4192050134,29,"Las ausencias temporales del Lehendakari superiores a un mes precisan:",["Autorización previa del Gobierno.","Autorización previa del Parlamento.","Autorización de la Diputación Permanente.","Comunicación al Presidente del Parlamento."],1,"Art. 15 Ley 7/1981."],[1950494403,29,"Según el art. 29 del Estatuto, el Gobierno Vasco es:",["El órgano de representación del Pueblo Vasco.","El órgano colegiado que ostenta las funciones ejecutivas y administrativas del País Vasco.","El órgano colegiado que ostenta las funciones legislativas y ejecutivas del País Vasco.","El órgano supremo de la Administración foral."],1,"Art. 29 EAPV."],[2543515288,29,"Crear o extinguir Departamentos del Gobierno Vasco, siempre que no suponga aumento del gasto público, corresponde a:",["El Parlamento Vasco, mediante ley.","Cada Consejero, mediante orden.","El Lehendakari, mediante decreto.","El Gobierno Vasco, mediante decreto."],2,"Art. 8.c) Ley 7/1981."],[2087052992,29,"Según el art. 20 de la Ley 7/1981, para la válida constitución del Gobierno Vasco se requiere la presencia de:",["Todos sus miembros.","El Lehendakari y dos tercios de sus miembros.","El Lehendakari o quien le sustituya y, al menos, la mitad de sus miembros.","La mayoría absoluta de sus miembros, sin necesidad de que asista el Lehendakari."],2,"Art. 20.2 Ley 7/1981. Sus deliberaciones son reservadas y secretas."],[3512598086,29,"El cargo de Consejero del Gobierno Vasco es compatible con:",[ ,"Integrada por igual número de representantes del Gobierno Vasco y de la Diputación Foral del Territorio interesado."],[1376110407,29,"Según el art. 41.2.b) del Estatuto, la exacción, gestión, liquidación, recaudación e inspección de todos los impuestos, salvo los que se integran en la Renta de Aduanas y los monopolios fiscales, corresponderá a:",["Las Juntas Generales.","El Gobierno Vasco.","La Agencia Estatal de Administración Tributaria.","Las Diputaciones Forales."],3,"Con la colaboración del Estado y su alta inspección."],[4115177624,29,"La reforma del Estatuto por el procedimiento general del art. 46 requiere la iniciativa del Parlamento Vasco a propuesta de:",["Dos grupos parlamentarios.","Un tercio de sus componentes.","Una quinta parte de sus componentes.","Una décima parte de sus componentes."],2,"Art. 46.1.a) EAPV. También tienen iniciativa el Gobierno Vasco y las Cortes Generales; la aprobación del Parlamento Vasco es por mayoría absoluta."],[3637873822,29,"En el procedimiento simplificado de reforma del Estatuto (art. 47.1), si en el plazo de 30 días ninguno de los órganos consultados se declara afectado:",["Se convoca, debidamente autorizado, un referéndum sobre el texto propuesto.","La reforma queda aprobada sin necesidad de referéndum.","Se remite el texto al Tribunal Constitucional.","El Parlamento Vasco debe aprobarla de nuevo por mayoría de dos tercios."],0,"Los órganos consultados son las Cortes Generales y las Juntas Generales; después se requiere la aprobación de las Cortes mediante ley orgánica."],[1615526987,29,"Según la Ley 3/2022, del Sector Público Vasco, los organismos autónomos de la Comunidad Autónoma:",["Se crean por decreto y se rigen por el derecho privado.","Se crean por ley y pueden ejercer potestades administrativas, excepto la expropiatoria.","Son sociedades de capital con participación pública mayoritaria.","Pueden ejercer todas las potestades administrativas, incluida la expropiatoria."],1,"Art. 38 Ley 3/2022. Las sociedades públicas se crean por decreto y no pueden ejercer autoridad pública."],[1825398224,29,"Según el art. 37 del Estatuto, es competencia exclusiva de los órganos forales de los Territorios Históricos:",["La ordenación del territorio y urbanismo.","La elaboración y aprobación de sus presupuestos.","La legislación electoral del Parlamento Vasco.","El régimen local."],1,"Art. 37.3 EAPV: organización de sus instituciones, presupuestos, demarcaciones supramunicipales, régimen de bienes provinciales y municipales y régimen electoral municipal, entre otras."],[361410651,30,"Según el art. 1 de la Ley 1/1988, el Tribunal Vasco de Cuentas Públicas es:",["Un órgano propio de la Comunidad Autónoma, dependiente directamente del Parlamento Vasco, y supremo órgano fiscalizador del Sector Público Vasco.","Un órgano dependiente del Gobierno Vasco adscrito al Departamento de Hacienda.","Un órgano dependiente de las Juntas Generales de los tres Territorios Históricos.","Una sección territorial del Tribunal de Cuentas del Estado."],0,"Ejerce sus funciones por delegación del Parlamento Vasco."],[2211533240,30,"¿Cuál de los siguientes entes NO está sujeto a la fiscalización del Tribunal Vasco de Cuentas Públicas según el art. 2 de la Ley 1/1988?",["Las Juntas Generales y las Diputaciones Forales.","Ninguno de ellos: todos están incluidos en su ámbito.","Las personas que perciban subvenciones del sector público vasco, en cuanto a su utilización y destino.","Las Entidades locales y sus sociedades públicas."],1,"Art. 2.1 Ley 1/1988, sin perjuicio de las competencias del Tribunal de Cuentas."],[2127865744,30,"En relación con el enjuiciamiento de la responsabilidad contable, el Tribunal Vasco de Cuentas Públicas:",["Puede instruir procedimientos jurisdiccionales por delegación del Tribunal de Cuentas.","Tiene competencia propia y exclusiva para juzgar la responsabilidad contable en el País Vasco.","Solo puede remitir los hechos al Ministerio Fiscal.","No tiene ninguna función relativa a la responsabilidad contable."],0,"Art. 3.1.b) Ley 1/1988; la acción es pública y puede adoptar medidas precautorias."],[1481023984,30,"El Tribunal Vasco de Cuentas Públicas emitirá el informe de fiscalización de la liquidación de los presupuestos de la Comunidad Autónoma en el plazo de:",["Cuatro meses desde la recepción de la documentación.","Seis meses desde el cierre del ejercicio.","Dos meses desde la recepción de la documentación.","Un año desde el cierre del ejercicio."],0,"Art. 9.4 Ley 1/1988. La documentación se rinde al mes siguiente a su confección."],[159109347,30,"La iniciativa fiscalizadora del Tribunal Vasco de Cuentas Públicas corresponde:",["Al Gobierno Vasco y a las Diputaciones Forales.","Al Parlamento Vasco y al propio Tribunal, mediante su programa anual.","Exclusivamente al propio Tribunal.","Al Parlamento Vasco y a las Juntas Generales por igual."],1,"Art. 11 Ley 1/1988. Antes de aprobar el programa anual consulta preceptivamente al Parlamento y a las Juntas Generales."],[3047714383,30,"Las conclusiones de los informes del Tribunal Vasco de Cuentas Públicas se publicarán en los boletines oficiales correspondientes en el plazo de:",["Dos meses.","Un mes.","Tres meses.","Quince días."],0,"Art. 13.2 Ley 1/1988."],[1207268839,30,"El Tribunal Vasco de Cuentas Públicas está compuesto por:",["Siete miembros nombrados por el Lehendakari.","Nueve miembros elegidos por mayoría absoluta del Parlamento.","Siete miembros elegidos por el Pleno del Parlamento Vasco con el voto favorable de tres quintas partes.","Cinco miembros, uno por cada Territorio Histórico y dos designados por el Gobierno."],2,"Arts. 14 y 15 Ley 1/1988. Se exige experiencia profesional mínima de doce años."],[3942294355,30,"El mandato de los miembros del Tribunal Vasco de Cuentas Públicas tendrá una duración máxima de:",["Cinco años, reelegibles una sola vez.","Seis años, pudiendo ser reelegidos por un mandato más.","Nueve años, sin posibilidad de reelección.","Cuatro años, coincidiendo con la legislatura."],1,"Art. 16.6 Ley 1/1988."],[472060622,30,"El Presidente del Tribunal Vasco de Cuentas Públicas es nombrado:",["Por el Rey, a propuesta del Gobierno Vasco.","Por el Lehendakari, a propuesta del Pleno del Tribunal por mayoría absoluta.","Por el Presidente del Parlamento Vasco.","Por el Parlamento Vasco por mayoría de tres quintos."],1,"Arts. 19 y 20 Ley 1/1988; su mandato se divide en dos periodos de tres años."],[2676460054,30,"El Pleno del Tribunal Vasco de Cuentas Públicas se reunirá, al menos:",["Seis veces al año.","Cuatro veces al año, una por trimestre natural.","Dos veces al año.","Una vez al mes."],1,"Art. 21.3 Ley 1/1988. Sus deliberaciones son reservadas."],[2555304349,30,"Contra los actos del Presidente del Tribunal Vasco de Cuentas Públicas cabe:",["Recurso de alzada ante el Parlamento Vasco.","Recurso contencioso-administrativo directo, sin vía previa.","Recurso de reposición ante el propio Presidente.","Recurso de súplica ante el Pleno."],3,"Art. 27 Ley 1/1988. Contra los actos del Secretario General, alzada ante el Presidente; los del Pleno agotan la vía administrativa."],[3153833944,30,"Según la Ley 3/1985, el Ararteko es:",["Un órgano dependiente del Gobierno Vasco para la defensa de los consumidores.","El alto comisionado del Parlamento Vasco para la defensa de los derechos del Título I de la Constitución.","Un órgano delegado del Defensor del Pueblo en el País Vasco.","Un comisionado de las Juntas Generales."],1,"Art. 1 Ley 3/1985. Es independiente y solo recibe instrucciones del Parlamento; actúa en coordinación con el Defensor del Pueblo."],[543157792,30,"El Ararteko es designado por el Parlamento Vasco con el voto favorable de:",["Las tres quintas partes de sus miembros.","La mayoría absoluta de sus miembros.","Las dos terceras partes de sus miembros.","La mayoría simple."],0,"Art. 2 Ley 3/1985. Si no se alcanza, se formulan sucesivas propuestas en el plazo máximo de un mes."],[720803150,30,"El Ararteko es elegido por un periodo de:" aciones municipales con una población no inferior a 20.000 habitantes.","La mayoría de los municipios de una circunscripción."],1,"Art. 11 NF 6/2005; su objeto debe tener carácter supramunicipal."],[752450997,32,"Las Juntas Generales de Gipuzkoa se reúnen anualmente:",["En dos periodos de sesiones.","En un único periodo de sesiones.","Solo cuando las convoca el Diputado General.","En tres periodos de sesiones cuatrimestrales."],1,"Art. 12.4 NF 6/2005."],[1223395320,32,"La modificación del Reglamento de las Juntas Generales de Gipuzkoa requiere:",["Mayoría de tres quintos.","Mayoría simple.","Mayoría de dos tercios.","Mayoría absoluta de las Juntas Generales en una votación final sobre el conjunto del proyecto."],3,"Art. 12.5 NF 6/2005. El Reglamento tiene rango de Norma Foral."],[2744397659,32,"Las Normas Forales de las Juntas Generales entran en vigor, salvo disposición en contrario:",["A los veinte días de su publicación en el Boletín Oficial de Gipuzkoa.","Al mes de su publicación en el BOE.","Al día siguiente de su publicación en el BOPV.","A los quince días de su publicación en el BOG."],0,"Art. 7 NF 6/2005. Las promulga el Diputado General."],[2936446661,32,"Las Juntas Generales pueden delegar en la Diputación Foral la potestad de dictar disposiciones con rango de Norma Foral, que se denominan:",["Decretos Forales de urgencia.","Decretos Forales Normativos.","Decretos Forales-Norma.","Órdenes Forales."],1,"Art. 13 NF 6/2005: no cabe en materia de organización, régimen y funcionamiento de los Órganos Forales."],[2224531278,32,"Los Decretos Forales-Norma dictados por razones de extraordinaria y urgente necesidad deben ser convalidados o derogados por las Juntas Generales en el plazo de:",["Un mes desde su aprobación.","Quince días desde su publicación.","Treinta días desde su publicación.","Veinte días desde su publicación."],2,"Art. 14 NF 6/2005."],[1979353778,32,"La moción de censura contra la Diputación Foral de Gipuzkoa debe ser propuesta, al menos, por:",[" ia.","La aprobación de los presupuestos.","La concertación de operaciones de crédito dentro de ciertos límites.","La aprobación de proyectos de obras de su competencia."],1,"Art. 22.4 LRBRL."],[3809577386,35,"Según el art. 26 LRBRL, en los municipios con población superior a 5.000 habitantes se debe prestar, además de los servicios comunes a todos:",["Instalaciones deportivas de uso público.","Protección civil y prevención y extinción de incendios.","Transporte colectivo urbano de viajeros.","Parque público, biblioteca pública y tratamiento de residuos."],3,"Más de 20.000: protección civil, servicios sociales de urgencia, incendios e instalaciones deportivas; más de 50.000: transporte colectivo urbano y medio ambiente urbano."],[2782265164,35,"El transporte colectivo urbano de viajeros es un servicio obligatorio en los municipios con población superior a:",["5.000 habitantes.","20.000 habitantes.","100.000 habitantes.","50.000 habitantes."],3,"Art. 26.1.d) LRBRL."],[440341386,35,"En los municipios con población inferior a 20.000 habitantes, según el art. 26.2 LRBRL y la LILE, la prestación de determinados servicios mínimos podrá ser coordinada por:",["La mancomunidad comarcal obligatoriamente.","El Gobierno Vasco, sin necesidad de conformidad municipal.","El Estado a través de la Delegación del Gobierno.","La Diputación Foral, con la conformidad de los municipios afectados."],3,"Arts. 26.2 LRBRL y 97-98 LILE."],[605478179,35,"La delegación de competencias del Estado o de las Comunidades Autónomas en los municipios (art. 27 LRBRL) tendrá una duración no inferior a:",["Cuatro años.","Cinco años.","Diez años.","Tres años."],1,"Art. 27.1 LRBRL; debe acompañarse de memoria económica y no generar mayor gasto."],[2014180027,35,"La Ley de Instituciones Locales de Euskadi es la:",["Ley 3/2022, de 12 de mayo.","Ley 27/1983, de 25 de noviembre.","Ley 2/2016, de 7 de abril.","Ley 7/1985, de 2 de abril."],2,"LILE."],[2634975024,35,"Según la LILE, ¿cuál de los siguientes es un principio que exige que toda ley que atribuya competencias a las entidades locales garantice su financiación?",["El principio de desconcentración.","El principio de suficiencia financiera.","El principio de jerarquía.","El principio de tutela financiera."],1,"Art. 4 LILE: subsidiariedad y suficiencia financiera."],[910885466,35,"La cláusula universal de competencias del art. 16 LILE permite a los municipios desarrollar actividades no encuadradas en sus competencias, siempre que no incurran en duplicidad ni comprometan su sostenibilidad financiera. El informe vinculante necesario debe emitirse en el plazo de:",["Diez días hábiles.","Veinte días hábiles.","Un mes.","Tres meses."],1,"Art. 16 LILE: si no se emite, el municipio puede proseguir."],[2376647704,35,"Según la LILE, el Alcalde tiene derecho a la dedicación exclusiva, salvo renuncia expresa, en los municipios de más de:",["10.000 habitantes.","1.000 habitantes.","5.000 habitantes.","20.000 habitantes."],1,"Art. 32.2 LILE."],[4289412823,35,"Según el estatuto de la oposición de la LILE (art. 33), en los municipios de más de 10.000 habitantes se garantiza:",["Una asignación económica al grupo mayoritario de la oposición, sin dedicación.","Al menos un concejal de la oposición con dedicación parcial.","Al menos dos concejales de la oposición con dedicación exclusiva.","Al menos un concejal de la oposición con dedicación exclusiva."],3,"Entre 5.000 y 10.000 habitantes, la dedicación es parcial."],[2156608093,35,"Según la LILE, las sesiones de la Junta de Gobierno Local:",["Son siempre públicas.","Son públicas solo en los municipios de gran población.","Son siempre secretas.","Son públicas cuando actúa por delegación del Pleno."],3,"Art. 30 LILE: la JGL es pública salvo acuerdo plenario por mayoría absoluta, pero siempre lo es cuando actúa por delegación del Pleno."],[4241835443,35,"Según la LILE, los municipios vascos pueden crear la figura de las vicealcaldías:",["Solo en los municipios de más de 50.000 habitantes."," nte por:",["El principio de especialidad territorial.","El principio de competencia, por razón de la materia.","El principio de jerarquía.","El principio de temporalidad."],1,"Ambas tienen el mismo rango y fuerza de ley; operan en ámbitos materiales distintos."],[4104757332,36,"¿Cuál de las siguientes características NO corresponde a la delegación legislativa del art. 82 CE?",["Puede ejercerse sucesivamente varias veces mientras no venza el plazo.","No puede referirse a materias reservadas a ley orgánica.","Debe otorgarse de forma expresa.","Debe hacerse para materia concreta y con plazo para su ejercicio."],0,"La delegación se agota por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente (art. 82.3 CE)."],[133171777,36,"La ley de bases que delega en el Gobierno la elaboración de un texto articulado:",["Puede autorizar al Gobierno a modificarla si lo exige el interés general.","Puede autorizar la subdelegación en los Ministros.","No podrá autorizar la modificación de la propia ley de bases ni facultar para dictar normas con carácter retroactivo.","Debe aprobarse por mayoría absoluta del Congreso."],2,"Art. 83 CE."],[1358545688,36,"El control de los decretos legislativos cuando el Gobierno se excede de los límites de la delegación corresponde, en lo excedido, a:",["Exclusivamente a las Cortes Generales.","Exclusivamente al Tribunal Constitucional.","El Consejo de Estado.","Los tribunales ordinarios de la jurisdicción contencioso-administrativa, además del Tribunal Constitucional."],3,"Art. 82.6 CE: sin perjuicio de la competencia propia de los Tribunales, las leyes de delegación pueden establecer fórmulas adicionales de control."],[4044279641,36,"Si el Congreso convalida un decreto-ley:",["Continúa vigente como decreto-ley, sin perder su naturaleza ni convertirse en ley.","Debe ser ratificado posteriormente por el Senado.","Se transforma en ley orgánica si afecta a derechos fundamentales.","Se transforma en ley ordinaria."],0,"Alternativamente, las Cortes pueden tramitarlo como proyecto de ley por el procedimiento de urgencia (art. 86.3 CE)."],[1555764370,36,"En la Comunidad Autónoma del País Vasco, la delegación legislativa en el Gobierno está prevista en:",["La Ley 7/1981, de Gobierno, y el Reglamento del Parlamento Vasco.","La Ley 3/2022 del Sector Público Vasco.","El Estatuto de Autonomía de forma expresa.","La Ley 27/1983 de Territorios Históricos."],0,"El Estatuto no recoge los decretos legislativos ni los decretos-leyes."],[2238155673,36,"Según la Ley 25/2014, de Tratados y otros Acuerdos Internacionales, las normas contenidas en los tratados internacionales válidamente celebrados y publicados:",["Tienen el mismo rango que las leyes ordinarias y pueden ser derogadas por ellas.","Tienen rango reglamentario.","Prevalecen incluso sobre la Constitución.","Prevalecerán sobre cualquier otra norma del ordenamiento interno en caso de conflicto, salvo las de rango constitucional."],3,"Art. 31 Ley 25/2014. Sus disposiciones solo pueden derogarse en la forma prevista en los propios tratados (art. 96 CE)."],[2891429460,37,"Los reglamentos que no derivan de una previa habilitación legal y solo caben en el ámbito organizativo se denominan:",["Reglamentos de necesidad.","Reglamentos ejecutivos (secundum legem).","Reglamentos independientes (praeter o extra legem).","Reglamentos contra legem."],2,"Los ejecutivos se dictan en virtud de remisiones de la ley para completarla y desarrollarla."],[2372276100,37,"La diferencia esencial entre el reglamento y el acto administrativo es que:",["El reglamento lo dicta siempre el Gobierno y el acto cualquier órgano.","El reglamento innova el ordenamiento jurídico, mientras que el acto se limita a aplicarlo a un supuesto concreto.","El acto administrativo tiene siempre destinatarios indeterminados.","El reglamento no puede ser impugnado ante los tribunales."],1,"El reglamento forma parte del ordenamiento; el acto es su aplicación."],[3882409626,37,"Según la Constitución, la potestad reglamentaria se atribuye expresamente a:",["Las Cortes Generales y el Gobierno.","El Gobierno, de acuerdo con la Constitución y las leyes (art. 97 CE).","El Consejo de Estado.","Los Ministros, en exclusiva."],1,"Art. 97 CE."],[587467799,37,"Los reglamentos de desarrollo y ejecución de las leyes estatales deben someterse preceptivamente a:",["Informe del Tribunal Supremo.","Informe del Tribunal de Cuentas.","Dictamen del Consejo de Estado.","Autorización de las Cortes Generales."],2,"Art. 5.1.h) Ley 50/1997 y Ley Orgánica del Consejo de Estado."],[2087021208,37,"Los reglamentos de las Cámaras parlamentarias:",["Son reglamentos administrativos controlables por la jurisdicción contencioso-administrativa.","Encuentran su fundamento directamente en la Constitución, tienen posición análoga a la ley y su control corresponde al Tribunal Constitucional.","Se aprueban por Real Decreto.","Requieren habilitación legal previa."],1,"Art. 27.2.d) LOTC."],[3198303518,37,"El principio de inderogabilidad singular de los reglamentos supone que:",["Los reglamentos no pueden derogarse una vez publicados.","Los reglamentos solo pueden derogarse por ley.","Un reglamento solo puede ser derogado por otro del mismo órgano.","Las resoluciones administrativas de carácter particular no pueden vulnerar lo establecido en una disposición de carácter general, aunque aquellas procedan de un órgano de igual o superior jerarquía."],3,"Art. 37.1 Ley 39/2015: son nulas las resoluciones que lo vulneren (art. 37.2)."],[502375190,37,"Los reglamentos solo pueden tener eficacia retroactiva:",["Siempre que se trate de reglamentos organizativos.","Nunca, en ningún caso.","Cuando así lo acuerde el Consejo de Ministros por razones de interés general.","Cuando desarrollen leyes que lo permitan y la retroactividad tenga efectos favorables."],3,"Art. 9.3 CE."],[2489851073,37,"Las disposiciones administrativas que vulneren la Constitución, las leyes u otras disposiciones administrativas de rango superior son:",["Válidas hasta que el Tribunal Constitucional las anule.","Irregulares no invalidantes.","Anulables.","Nulas de pleno derecho."],3,"Art. 47.2 Ley 39/2015."],[3629752041,37,"Las Circulares e Instrucciones de los órganos administrativos:",["Tienen el mismo rango que las Órdenes ministeriales.","Son reglamentos ejecutivos.","Son directrices internas dirigidas a la organización del trabajo administrativo, sin carácter de normas que afecten a los ciudadanos.","Deben ser aprobadas por el Consejo de Ministros."],2,"Art. 6 Ley 40/2015: su incumplimiento no afecta por sí solo a la validez de los actos."],[2582661868,37,"Un juez ordinario que entiende que un reglamento vulnera la ley aplicable al caso:",["Debe plantear cuestión de inconstitucionalidad.","Debe aplicarlo hasta que sea anulado por el Tribunal Supremo.","Debe suspender el proceso y consultar al Consejo de Estado.","Puede inaplicarlo."],3,"Art. 6 LOPJ. La impugnación directa e indirecta de reglamentos corresponde a la jurisdicción contencioso-administrativa."],[1152884630,38,"El principio de vinculación positiva de la Administración a la ley significa que:",["La Administración puede hacer todo lo que la ley no le prohíba.","Los ciudadanos solo pueden actuar con autorización administrativa.","La Administración solo puede actuar cuando una norma la habilita para ello.","La ley debe regular exhaustivamente toda actuación administrativa."],2,"La vinculación negativa (todo lo no prohibido está permitido) es propia de los particulares."],[2984863054,38,"Las potestades en las que la ley determina exhaustivamente todas las condiciones para su ejercicio se denominan:",["Potestades discrecionales.","Potestades regladas.","Potestades implícitas.","Potestades de autotutela."],1,"En las discrecionales la ley deja a la estimación de la Administración algunas condiciones de ejercicio."],[3278040270,38,"El ejercicio de potestades administrativas para fines distintos de los fijados por el ordenamiento jurídico se denomina:",["Vía de hecho.","Desviación de poder.","Exceso de jurisdicción.","Abuso de derecho."],1,"Art. 48.1 Ley 39/2015 y art. 70.2 LJCA: es causa de anulabilidad."],[3301772242,38,"¿Cuál de las siguientes NO es una técnica de control de la discrecionalidad administrativa?",["El control de los hechos determinantes.","El control de los elementos reglados (competencia, procedimiento, fin).","El control de la oportunidad política de la decisión por el juez.","El control a través de los principios generales del Derecho."],2,"El juez no sustituye el criterio de oportunidad de la Administración, sino que controla los límites de la discrecionalidad."],[3513854329,38,"Según el art. 103.1 CE, la Administración Pública actúa:",["Con sometimiento a la ley y a las instrucciones del Gobierno.","Con sometimiento a la ley, salvo en el ejercicio de potestades discrecionales.","Conforme a criterios de oportunidad política.","Con sometimiento pleno a la ley y al Derecho."],3,"Art. 103.1 CE: principios de eficacia, jerarquía, descentralización, desconcentración y coordinación."],[3042052834,39,"Según el art. 1 de la Ley 39/2015, solo mediante ley podrán incluirse trámites adicionales o distintos a los contemplados en ella, cuando:",["Lo acuerde el Consejo de Ministros por razones de urgencia.","Resulte eficaz, proporcionado y necesario para la consecución de los fines propios del procedimiento, de manera motivada.","Lo exija el interés general apreciado por el órgano competente.","Así lo establezca un reglamento ejecutivo."],1,"Art. 1.2 Ley 39/2015. Reglamentariamente solo pueden concretarse órganos, plazos, formas de iniciación y terminación, publicación e informes."],[3701871691,39,"¿Cuál de los siguientes sujetos tiene la consideración de interesado aunque no se haya personado en el procedimiento, según el art. 4 de la Ley 39/2015?",["Quien haya presentado una denuncia.","Quien, sin haber iniciado el procedimiento, tenga derechos que puedan resultar afectados por la decisión.","Quien haya comparecido en el trámite de información pública.","Quien tenga intereses legítimos que puedan resultar afectados."],1,"Los titulares de intereses legítimos solo son interesados si se personan antes de la resolución definitiva (art. 4.1.c)."],[2019865221,39,"Para formular solicitudes, presentar declaraciones responsables, interponer recursos, desistir o renunciar en nombre de otra persona:",["Es necesario poder notarial en todo caso.","Basta con que el representante lo manifieste.","Deberá acreditarse la representación.","Se presume la representación."],2,"Art. 5.3 Ley 39/2015. Para los actos de mero trámite se presume."],[1591447822,39,"Los poderes inscritos en el registro electrónico de apoderamientos tendrán una validez determinada máxima de:",["Cinco años a contar desde la fecha de inscripción.","Un año, renovable.","Diez años.","Tres años."],0,"Art. 6.6 Ley 39/2015."],[3321596349,39,"La falta o insuficiencia de acreditación de la representación no impedirá que se tenga por realizado el acto, siempre que se aporte o subsane en el plazo de:",["Quince días.","Diez días.","Un mes.","Cinco días."],1,"Art. 5.6 Ley 39/2015."],[2303981838,39,"En los procedimientos con pluralidad de interesados, cuando no se haya designado representante, las actuaciones se efectuarán con:",["Todos los interesados por separado.","El interesado de mayor edad.","El interesado que figure en primer término.","El que designe el órgano instructor."],2,"Art. 7 Ley 39/2015."],[1596802675,39,"La firma electrónica de los interesados es exigible, según el art. 11 de la Ley 39/2015, para:",["Únicamente para interponer recursos.","Cualquier actuación en el procedimiento.","Formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos.","Acceder al expediente."],2,"Para el resto basta la identificación."],[2799790313,40,"¿Cuál de los siguientes sujetos NO está obligado a relacionarse electrónicamente con las Administraciones Públicas según el art. 14 de la Ley 39/2015?",["Las personas físicas, con carácter general.","Las personas jurídicas.","Las entidades sin personalidad jurídica.","Quienes ejerzan una actividad profesional con colegiación obligatoria, en dicha actividad."],0,"Las personas físicas pueden elegir, salvo que estén obligadas."],[1448002682,40,"Si un interesado obligado a relacionarse electrónicamente presenta su solicitud de forma presencial:",["Se tendrá por no presentada sin más trámite.","Se le impondrá una sanción.","Se admitirá y se digitalizará de oficio, manteniendo la fecha original.","Se le requerirá para que la subsane mediante presentación electrónica, y se considerará fecha de presentación la de la subsanación."],3,"Art. 68.4 Ley 39/2015."],[4120491758,40,"Cuando la norma reguladora del procedimiento no fije el plazo máximo para resolver, este será de:",["Un mes.","Dos meses.","Tres meses.","Seis meses."],2,"Art. 21.3 Ley 39/2015. El plazo fijado por norma no puede exceder de seis meses salvo ley o Derecho de la UE."],[4134447963,40,"En los procedimientos iniciados a solicitud del interesado, el plazo máximo para resolver se cuenta:",["Desde el acuerdo de admisión a trámite.","Desde que el expediente se asigna al instructor.","Desde la fecha en que la solicitud haya tenido entrada en el registro electrónico de la Administración u organismo competente para su tramitación.","Desde la fecha de presentación de la solicitud en cualquier registro."],2,"Art. 21.3.b) Ley 39/2015. En los iniciados de oficio, desde la fecha del acuerdo de iniciación."],[2601052478,40,"La suspensión del plazo máximo para resolver por la solicitud de informes preceptivos no podrá exceder de:",["Un mes.","Tres meses.","Dos meses.","Seis meses."],1,"Art. 22.1.d) Ley 39/2015."],[1083200453,40,"En los procedimientos iniciados a solicitud del interesado, como regla general, el vencimiento del plazo máximo sin haberse notificado resolución expresa legitima al interesado para entend "Art. 30.2 Ley 39/2015."],[2214974693,40,"Si el plazo se fija en meses o años, este concluirá:",["El último día hábil del mes de vencimiento.","El día anterior al de la notificación en el mes de vencimiento.","A los treinta días por cada mes.","El mismo día en que se produjo la notificación, publicación o silencio en el mes o año de vencimiento; si no hubiera día equivalente, el último día del mes."],3,"Art. 30.4 Ley 39/2015."],[3718656110,40,"La presentación de documentos en un registro electrónico en un día inhábil se entenderá realizada:",["A las 23:59 del último día hábil anterior.","En la primera hora del primer día hábil siguiente, salvo que una norma permita expresamente la recepción en día inhábil.","En ese mismo día inhábil.","En el día hábil siguiente a las 12:00."],1,"Art. 31.2.b) Ley 39/2015."],[3258975558,40,"La ampliación de los plazos establecidos (art. 32 Ley 39/2015):",["Es recurrible en alzada.","Puede acordarse una vez vencido el plazo.","No puede exceder de la mitad de los mismos y debe acordarse antes del vencimiento; no es susceptible de recurso.","Puede alcanzar el doble del plazo inicial."],2,"Art. 32 Ley 39/2015."],[2589052534,40,"Cuando se acuerde la tramitación de urgencia de un procedimiento (art. 33 Ley 39/2015):",["El acuerdo es recurrible en alzada.","Se suprime el trámite de audiencia.","Se reducen a la mitad todos los plazos, incluidos los de recurso.","Se reducen a la mitad los plazos del procedimiento ordinario, salvo los relativos a la presentación de solicitudes y recursos."],3,"No cabe recurso contra el acuerdo que declare la urgencia."],[721136832,41,"¿Cuál de los siguientes actos debe estar motivado según el art. 35 de la Ley 39/2015?",["Los que concedan lo solicitado por el interesado.","Los que se dicten en el ejercicio de potestades discrecionales.","Todos los actos de trámite.","Las providencias de impulso del procedimiento."],1,"También los que limiten derechos, resuelvan recursos, se separen de precedentes o dictámenes, lón de anuncios del Ayuntamiento del último domicilio.","El boletín oficial de la provincia.","El Boletín Oficial del Estado."],3,"Art. 44 Ley 39/2015 (Tablón Edictal Único)."],[379835041,41,"¿Cuál de los siguientes actos es nulo de pleno derecho según el art. 47.1 de la Ley 39/2015?",["El dictado con desviación de poder.","El dictado por órgano manifiestamente incompetente por razón de la materia o del territorio.","El que incurra en un defecto de forma que no produzca indefensión.","El dictado fuera del plazo establecido, salvo que lo imponga la naturaleza del término."],1,"La desviación de poder y las demás infracciones del ordenamiento son causas de anulabilidad (art. 48)."],[195175945,41,"El defecto de forma solo determinará la anulabilidad del acto cuando:",["Afecte a la motivación.","Así lo aprecie el superior jerárquico.","El acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados.","Lo alegue el interesado en el plazo de diez días."],2,"Art. 48.2 Ley 39/2015."],[881399533,41,"El acto nulo o anulable que contenga los elementos constitutivos de otro distinto producirá los efectos de este. Esta regla se conoce como:",["Convalidación.","Conversión de actos viciados.","Conservación de actos y trámites.","Inderogabilidad singular."],1,"Art. 50 Ley 39/2015."],[3141427463,41,"Según el art. 52 de la Ley 39/2015, la Administración podrá convalidar:",["Los actos anulables, subsanando los vicios de que adolezcan.","Solo los actos nulos por incompetencia.","Los actos nulos y anulables.","Únicamente los actos favorables."],0,"Los actos nulos no son convalidables."],[3765002123,42,"Las medidas provisionales adoptadas antes de la iniciación del procedimiento en casos de urgencia inaplazable deberán ser confirmadas, modificadas o levantadas en el acuerdo de iniciación, que deberá efectuarse dentro de:",["Los cinco días siguientes a su adopción.","El mes siguiente a su adopción.","Los diez días siguientes a s eptivos."],1,"Art. 70.4 Ley 39/2015."],[598072696,42,"Los trámites que deban ser cumplimentados por los interesados deberán realizarse, salvo que se fije otro plazo, en el de:",["Cinco días.","Veinte días.","Quince días.","Diez días a partir del siguiente al de la notificación del correspondiente acto."],3,"Art. 73.1 Ley 39/2015."],[3752791880,42,"Las cuestiones incidentales que se susciten en el procedimiento:",["No suspenderán la tramitación del mismo, salvo la recusación.","Suspenderán la tramitación si así lo solicita el interesado.","Suspenderán siempre la tramitación.","Deberán resolverse antes de continuar cualquier trámite."],0,"Art. 74 Ley 39/2015."],[2869733928,42,"El periodo de prueba en el procedimiento administrativo será de:",["Un mes en todo caso.","Entre cinco y veinte días.","Quince días improrrogables.","No superior a treinta días ni inferior a diez, pudiendo acordarse un periodo extraordinario no superior a diez días."],3,"Art. 77.2 Ley 39/2015."],[1913839276,42,"Salvo disposición expresa en contrario, los informes en el procedimiento administrativo serán:",["Preceptivos y no vinculantes, con plazo de quince días.","Preceptivos y vinculantes.","Facultativos y no vinculantes, y se emitirán en el plazo de diez días.","Facultativos y vinculantes."],2,"Arts. 80.1 y 80.2 Ley 39/2015."],[3009768310,42,"El trámite de audiencia se concederá a los interesados por un plazo:",["No inferior a diez días ni superior a quince.","No inferior a quince días ni superior a veinte.","De veinte días.","De diez días."],0,"Art. 82.2 Ley 39/2015. Puede prescindirse si no figuran ni se tienen en cuenta otros hechos, alegaciones o pruebas que las del interesado."],[1601791472,42,"En el trámite de información pública, el plazo para formular alegaciones no podrá ser inferior a:",["Veinte días.","Treinta días.","Diez días.","Quince días."],0,"Art. 83.2 Ley 39/2015. La comparecencia no otorga la condición de interesado."],[1328931588,43,"En el procedimiento sancionador, el reco er al mismo partido político que el interesado.","Tener parentesco de consanguinidad dentro del quinto grado con un interesado."],1,"También: interés personal, amistad íntima o enemistad manifiesta, intervención como perito o testigo y relación de servicio o servicios profesionales en los dos últimos años."],[4244434993,46,"La actuación de autoridades y personal en los que concurran motivos de abstención:",["No implicará, necesariamente y en todo caso, la invalidez de los actos en que hayan intervenido.","Determina siempre la anulabilidad de los actos.","Determina la nulidad de pleno derecho de los actos.","Es causa de revisión extraordinaria."],0,"Art. 23.4 Ley 40/2015; sí da lugar a responsabilidad."],[2043580360,46,"Planteada la recusación, si el recusado niega la causa, el superior resolverá en el plazo de:",["Tres días.","Diez días.","Cinco días.","Un día."],0,"Art. 24.3 Ley 40/2015. Contra estas resoluciones no cabe recurso, sin perjuicio de alegarlo al recurrir el acto final."],[2372512329,46,"Según el art. 140 de la Ley 40/2015, el principio por el que dos o más Administraciones, de manera voluntaria y en ejercicio de sus competencias, asumen compromisos específicos en aras de una acción común es el de:",["Coordinación.","Colaboración.","Lealtad institucional.","Cooperación."],3,"La colaboración es un deber; la coordinación supone que una Administración garantiza la coherencia de las actuaciones de las demás."],[2109277188,47,"Según el art. 47 de la Ley 40/2015, NO tienen la consideración de convenios:",["Los acuerdos entre organismos de una misma Administración.","Los protocolos generales de actuación o instrumentos similares que comporten meras declaraciones de intención sin compromisos jurídicos concretos y exigibles.","Los acuerdos entre dos Administraciones para un fin común.","Los acuerdos con sujetos de Derecho privado para un fin común."],1,"Art. 47.1 Ley 40/2015."],[1283783824,47,"Los convenios firmados entre organismos públicos y entidades de derec
